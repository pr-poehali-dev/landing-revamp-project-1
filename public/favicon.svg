<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#0A1A30"/>
      <stop offset="100%" stop-color="#050D1A"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="31" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="28.5" fill="none" stroke="#00E5F5" stroke-width="2" opacity="0.9" filter="url(#glow)"/>

  <g stroke="#00E5F5" stroke-width="3.4" stroke-linecap="round" filter="url(#glow)">
    <line x1="20" y1="20" x2="44" y2="44"/>
    <line x1="44" y1="20" x2="20" y2="44"/>
  </g>

  <g fill="#00E5F5" filter="url(#glow)">
    <circle cx="20" cy="20" r="2.6"/>
    <circle cx="44" cy="20" r="2.6"/>
    <circle cx="20" cy="44" r="2.6"/>
    <circle cx="44" cy="44" r="2.6"/>
    <circle cx="32" cy="32" r="3"/>
  </g>
</svg>
